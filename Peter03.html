<!DOCTYPE html>
<html>
<head>
  <title>Basic Table Layout Example</title>
</head>
<body>
  <h1>Simple Table Layout</h1>
  <table border="1">
    <caption>Class Timetable</caption>
    <tr>
      <th rowspan="2" align="center">Day</th>
      <th colspan="2" align="center">Session</th>
    </tr>
    <tr>
      <th align="center">Morning</th>
      <th align="center">Afternoon</th>
    </tr>
    <tr>
      <td align="center">Monday</td>
      <td align="center">Maths</td>
      <td align="center">Science</td>
    </tr>
    <tr>
      <td align="center">Tuesday</td>
      <td colspan="2" align="center">Sports & Activities</td>
    </tr>
  </table>
</body>
</html>
